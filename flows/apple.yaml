appId: com.savvytravel.app
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Map"
    timeout: 60000
- takeScreenshot: f01-home
- tapOn: "Map"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: f02-map
- tapOn:
    text: "Search your saved places"
- inputText: "pharmacy"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: f03-search-pharmacy
- eraseText: 20
- inputText: "cafe"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: f04-search-cafe
- tapOn:
    id: "apple-result-0"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: f05-place-sheet
- tapOn:
    id: "apple-place-add-to-trip"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: f06-trip-picker
