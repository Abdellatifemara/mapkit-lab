appId: com.savvytravel.app
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*Map.*"
    timeout: 60000
- tapOn: "Map"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: o01-world
- tapOn:
    text: "Show my location"
    optional: true
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: o02-zamalek
