name: app
# Builds a private app for the iOS Simulator and screenshots it. The source is fetched at run time
# with a read-only deploy key (secret) and never committed here; every step's output goes to a log
# file; screenshots and logs leave the runner only as an AES-encrypted archive (password = secret).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: git ref to build
        default: master
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Fetch source (private)
        env:
          KEY: ${{ secrets.SAVVY_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh out
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy" git clone -q --depth 1 --branch "${{ inputs.ref }}" \
            git@github.com:Abdellatifemara/SavvyTravel.git src >/dev/null 2>&1 && echo "source ok" || { echo "source failed"; exit 1; }
          rm -f ~/.ssh/deploy
      - name: Newest Xcode (expo-age-range needs the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X" && xcodebuild -version
          xcrun simctl list runtimes | grep -i ios
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache public downloads
        uses: actions/cache@v4
        with:
          # Public downloads only: the derived data and Pods hold our compiled private code, and a
          # public repo's caches are not private, so those are never cached.
          path: |
            ~/Library/Caches/CocoaPods
            ~/.npm
          key: sim-${{ hashFiles('src/MobileFrontend/package-lock.json') }}
          restore-keys: sim-
      - name: Build for the simulator
        env:
          ENVIRONMENT: production
          EXPO_PUBLIC_ENVIRONMENT: production
          EXPO_PUBLIC_API_URL: https://api.savvytravel.app/api/v1
          E2E_SIM_LAB: "1"
        run: |
          set -o pipefail
          cd src/MobileFrontend
          { npm ci --no-audit --no-fund && npx expo prebuild -p ios --clean --no-install \
            && (cd ios && pod install)             && for f in ios/*/Supporting/Expo.plist; do /usr/libexec/PlistBuddy -c "Set :EXUpdatesEnabled false" "$f" || /usr/libexec/PlistBuddy -c "Add :EXUpdatesEnabled bool false" "$f"; done ; } > ../../out/install.log 2>&1 && echo "install ok" || { echo "install failed"; exit 1; }
          WS=$(ls -d ios/*.xcworkspace | head -1); SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../dd CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= build \
            > ../../out/xcodebuild.log 2>&1 && echo "build ok" || { echo "build failed"; exit 1; }
      - name: Run in the simulator
        env:
          SIM_TOKEN: ${{ secrets.SIM_TOKEN }}
        run: |
          mkdir -p out/shots
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          [ -n "$UDID" ] || UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b > /dev/null
          APP=$(ls -d dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          # Signed in as the TEST account without a token in the bundle: the app (simLab build only)
          # reads it from its own defaults, written here.
          xcrun simctl spawn "$UDID" defaults write "$BID" simToken "$SIM_TOKEN"
          xcrun simctl privacy "$UDID" grant location "$BID" || true
          xcrun simctl location "$UDID" set 30.0571,31.2243 || true
          # Console (stdout/stderr incl. JS errors) for 45 s, screenshots along the way.
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'process == "SavvyTravel"' > out/app-stream.log 2>&1 &
          SPID=$!
          sleep 2
          xcrun simctl launch --console-pty "$UDID" "$BID" > out/console.log 2>&1 &
          LPID=$!
          xcrun simctl io "$UDID" recordVideo --codec h264 --force out/shots/launch.mp4 > /dev/null 2>&1 &
          VPID=$!
          for t in 30 60 90 120; do sleep 30; xcrun simctl io "$UDID" screenshot "out/shots/at-${t}s.png" > /dev/null; done
          kill -INT $VPID 2>/dev/null; sleep 3
          kill $LPID $SPID 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 5m --style compact             --predicate 'process CONTAINS[c] "SavvyTravel" OR subsystem CONTAINS[c] "savvytravel" OR eventMessage CONTAINS[c] "SavvyTravel"'             > out/device.log 2>&1 || true
          mkdir -p out/crash; cp ~/Library/Logs/DiagnosticReports/*SavvyTravel* out/crash/ 2>/dev/null || true
          ls out/crash | head; echo "run ok"
      - name: Encrypt results
        if: always()
        env:
          PASS: ${{ secrets.SHOTS_PASSWORD }}
        run: |
          tar czf results.tgz out 2>/dev/null || true
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in results.tgz -out results.enc -pass env:PASS
          rm -rf out results.tgz src dd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results.enc
